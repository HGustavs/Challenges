<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Isometric VW Golf Mk2 Detailed Blueprint</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }
        svg {
            background-color: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        .info {
            position: absolute;
            top: 20px;
            color: #888;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="info">Move mouse left / right to rotate VW Golf Mk2</div>
    <svg id="canvas" width="800" height="600"></svg>

    <script>
        const svg = document.getElementById('canvas');
        const width = 800;
        const height = 600;
        const originX = width / 2;
        const originY = height / 2 + 30;

        const isoAngleX = Math.PI / 6; // 30 degrees tilt down
        
        let targetAngleY = 0;
        let currentAngleY = 0;

        // Base Vertices array for body, bumpers, windows, and details
        const baseVertices = [
            // --- FRONT BUMPER (Protruding) ---
            { id: 'fb_top_l', x: -33, y: -4, z: 80 },
            { id: 'fb_top_r', x: 33, y: -4, z: 80 },
            { id: 'fb_bot_l', x: -33, y: 3, z: 80 },
            { id: 'fb_bot_r', x: 33, y: 3, z: 80 },
            { id: 'fb_back_l', x: -35, y: -4, z: 74 },
            { id: 'fb_back_r', x: 35, y: -4, z: 74 },

            // --- REAR BUMPER (Protruding) ---
            { id: 'rb_top_l', x: -35, y: -4, z: -80 },
            { id: 'rb_top_r', x: 35, y: -4, z: -80 },
            { id: 'rb_bot_l', x: -35, y: 3, z: -80 },
            { id: 'rb_bot_r', x: 35, y: 3, z: -80 },
            { id: 'rb_front_l', x: -35, y: -4, z: -74 },
            { id: 'rb_front_r', x: 35, y: -4, z: -74 },

            // --- MAIN BODY BASE (Narrower Front, Wider Mid) ---
            { id: 'body_f_l', x: -32, y: -20, z: 74 },
            { id: 'body_f_r', x: 32, y: -20, z: 74 },
            { id: 'body_m_l', x: -35, y: -20, z: 0 },
            { id: 'body_m_r', x: 35, y: -20, z: 0 },
            { id: 'body_r_l', x: -34, y: -20, z: -74 },
            { id: 'body_r_r', x: 34, y: -20, z: -74 },

            // --- SIDE MOLDINGS / RUBBING STRIPS ---
            { id: 'strip_f_l', x: -33, y: -12, z: 70 },
            { id: 'strip_f_r', x: 33, y: -12, z: 70 },
            { id: 'strip_r_l', x: -35, y: -12, z: -70 },
            { id: 'strip_r_r', x: 35, y: -12, z: -70 },

            // --- WINDSHIELD & CABIN BASE ---
            { id: 'wind_bot_l', x: -32, y: -25, z: 25 },
            { id: 'wind_bot_r', x: 32, y: -25, z: 25 },
            { id: 'wind_top_l', x: -28, y: -52, z: 12 },
            { id: 'wind_top_r', x: 28, y: -52, z: 12 },

            // --- ROOF STRUCTURE ---
            { id: 'roof_r_l', x: -28, y: -52, z: -50 },
            { id: 'roof_r_r', x: 28, y: -52, z: -50 },

            // --- REAR HATCH & C-PILLAR ---
            { id: 'hatch_mid_l', x: -33, y: -24, z: -74 },
            { id: 'hatch_mid_r', x: 33, y: -24, z: -74 },

            // --- SIDE WINDOWS (B-Pillar division) ---
            { id: 'bpillar_top_l', x: -28, y: -52, z: -18 },
            { id: 'bpillar_top_r', x: 28, y: -52, z: -18 },
            { id: 'bpillar_bot_l', x: -35, y: -22, z: -18 },
            { id: 'bpillar_bot_r', x: 35, y: -22, z: -18 },

            // --- DOOR HANDLES ---
            { id: 'dh_f_l_1', x: -35.5, y: -16, z: 10 },
            { id: 'dh_f_l_2', x: -35.5, y: -16, z: 2 },
            { id: 'dh_r_l_1', x: -35.5, y: -16, z: -25 },
            { id: 'dh_r_l_2', x: -35.5, y: -16, z: -33 },

            { id: 'dh_f_r_1', x: 35.5, y: -16, z: 10 },
            { id: 'dh_f_r_2', x: 35.5, y: -16, z: 2 },
            { id: 'dh_r_r_1', x: 35.5, y: -16, z: -25 },
            { id: 'dh_r_r_2', x: 35.5, y: -16, z: -33 },

            // --- FRONT GRILLE SLATS (Horizontal line endpoints) ---
            { id: 'grill_s1_l', x: -31, y: -16, z: 74.2 },
            { id: 'grill_s1_r', x: 31, y: -16, z: 74.2 },
            { id: 'grill_s2_l', x: -31, y: -11, z: 74.2 },
            { id: 'grill_s2_r', x: 31, y: -11, z: 74.2 },
            { id: 'grill_s3_l', x: -31, y: -6, z: 74.2 },
            { id: 'grill_s3_r', x: 31, y: -6, z: 74.2 },
        ];

        // Generator helpers
        function createWheel(centerX, centerY, centerZ, radius = 9.5) {
            const points = [];
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                points.push({
                    x: centerX,
                    y: centerY + Math.sin(angle) * radius,
                    z: centerZ + Math.cos(angle) * radius
                });
            }
            return points;
        }

        function createHeadlight(centerX, centerY, centerZ, radius = 5.5) {
            const points = [];
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                points.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    z: centerZ
                });
            }
            return points;
        }

        // Generate wheels & headlights
        const wheelFL = createWheel(-33, 5, 42);
        const wheelFR = createWheel(33, 5, 42);
        const wheelRL = createWheel(-34, 5, -42);
        const wheelRR = createWheel(34, 5, -42);

        const headlightL = createHeadlight(-20, -11, 74.5);
        const headlightR = createHeadlight(20, -11, 74.5);

        // Combine all 3D vertices
        const allVertices = [
            ...baseVertices,
            ...wheelFL, ...wheelFR, ...wheelRL, ...wheelRR,
            ...headlightL, ...headlightR
        ];

        // Define Wireframe Edges
        const edges = [
            // --- FRONT BUMPER ---
            [0, 1], [2, 3], [0, 2], [1, 3],
            [0, 4], [2, 4], [1, 5], [3, 5],

            // --- REAR BUMPER ---
            [6, 7], [8, 9], [6, 8], [7, 9],
            [6, 10], [8, 10], [7, 11], [9, 11],

            // --- HOOD & LOWER BODY ---
            [12, 13], [12, 18], [13, 19], // Hood profile
            [18, 22], [19, 23], // Windshield lower boundary
            [12, 14], [13, 15], [14, 16], [15, 17], // Beltline

            // --- SIDE RUBBING STRIPS ---
            [20, 21],

            // --- WINDSHIELD & ROOF ---
            [22, 23], [24, 25], [22, 24], [23, 25], // Windshield glass frame
            [24, 26], [25, 27], [26, 27],           // Roof perimeter

            // --- HATCHBACK / REAR WINDOW ---
            [26, 28], [27, 29], [28, 29], [28, 16], [29, 17],

            // --- SIDE WINDOWS & B-PILLAR ---
            [30, 31], [30, 32], [31, 33],

            // --- DOOR HANDLES ---
            [34, 35], [36, 37], [38, 39], [40, 41],

            // --- FRONT GRILLE SLATS ---
            [42, 43], [44, 45], [46, 47]
        ];

        // Helper to loop index rings
        function addLoopEdges(startIndex) {
            for (let i = 0; i < 8; i++) {
                const next = (i === 7) ? startIndex : startIndex + i + 1;
                edges.push([startIndex + i, next]);
            }
        }

        const baseVCount = baseVertices.length;
        addLoopEdges(baseVCount);      // FL Wheel
        addLoopEdges(baseVCount + 8);  // FR Wheel
        addLoopEdges(baseVCount + 16); // RL Wheel
        addLoopEdges(baseVCount + 24); // RR Wheel

        const wheelsVCount = baseVCount + 32;
        addLoopEdges(wheelsVCount);     // Left Headlight
        addLoopEdges(wheelsVCount + 8); // Right Headlight

        // Build SVG elements
        function createSvgElement(tag, attrs) {
            const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            for (let key in attrs) {
                el.setAttribute(key, attrs[key]);
            }
            return el;
        }

        const lineElements = [];
        edges.forEach((edge, index) => {
            const isHeadlight = index >= (edges.length - 16);
            const line = createSvgElement('line', {
                'stroke': isHeadlight ? '#ffff00' : '#00ffcc',
                'stroke-width': isHeadlight ? '1.8' : '1.5',
                'stroke-linecap': 'round',
                'stroke-linejoin': 'round'
            });
            svg.appendChild(line);
            lineElements.push(line);
        });

        // Track mouse rotation
        window.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth;
            targetAngleY = (mouseX - 0.5) * Math.PI * 2;
        });

        // 3D Matrix Projection
        function project(point, angleY) {
            // Y-axis Yaw rotation
            const cosY = Math.cos(angleY);
            const sinY = Math.sin(angleY);

            const x1 = point.x * cosY + point.z * sinY;
            const y1 = point.y;
            const z1 = -point.x * sinY + point.z * cosY;

            // X-axis Pitch tilt
            const cosX = Math.cos(isoAngleX);
            const sinX = Math.sin(isoAngleX);

            const x2 = x1;
            const y2 = y1 * cosX - z1 * sinX;
            const z2 = y1 * sinX + z1 * cosX;

            // Scale to screen
            const scale = 2.3;
            const screenX = originX + x2 * scale;
            const screenY = originY + y2 * scale;

            return { x: screenX, y: screenY, z: z2 };
        }

        // Animation Loop
        function animate() {
            currentAngleY += (targetAngleY - currentAngleY) * 0.08;

            const projectedPoints = allVertices.map(v => project(v, currentAngleY));

            edges.forEach((edge, index) => {
                const p1 = projectedPoints[edge[0]];
                const p2 = projectedPoints[edge[1]];

                lineElements[index].setAttribute('x1', p1.x);
                lineElements[index].setAttribute('y1', p1.y);
                lineElements[index].setAttribute('x2', p2.x);
                lineElements[index].setAttribute('y2', p2.y);
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
