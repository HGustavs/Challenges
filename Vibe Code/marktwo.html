<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Isometric Vector Geometry Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Toolbar */
        #toolbar {
            height: 50px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }
        .btn-group { display: flex; gap: 8px; align-items: center; }
        button {
            background-color: #2d2d2d;
            color: #ccc;
            border: 1px solid #444;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        button:hover { background-color: #3d3d3d; color: #fff; border-color: #555; }
        button.active { background-color: #007acc; color: #fff; border-color: #0098ff; }
        
        .file-input-label {
            background-color: #252526;
            color: #aaa;
            border: 1px dashed #444;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .file-input-label:hover { color: #fff; border-color: #666; }
        input[type="file"] { display: none; }

        /* Main Workspace */
        #workspace {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100vh - 50px);
        }

        /* Four Orthographic Views Grid */
        #editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100%;
            height: 100%;
            gap: 2px;
            background-color: #2a2a2a;
        }
        .view-panel {
            position: relative;
            background-color: #181818;
            overflow: hidden;
        }
        .view-title {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #007acc;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 5;
            background: rgba(24, 24, 24, 0.8);
            padding: 2px 6px;
            border-radius: 3px;
        }
        .bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.35;
            pointer-events: none;
        }
        svg.viewport {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Isometric Fullscreen Preview Mode */
        #preview-panel {
            display: none;
            width: 100%;
            height: 100%;
            background-color: #111;
            position: relative;
        }
        .info-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #666;
            pointer-events: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Mode visibility rules */
        body.mode-preview #editor-grid { display: none; }
        body.mode-preview #preview-panel { display: block; }
        body.edit-mode-addpoint svg { cursor: crosshair; }
        body.edit-mode-line line { cursor: pointer; }
    </style>
</head>
<body class="edit-mode-point">

    <!-- Top Navigation Toolbar -->
    <div id="toolbar">
        <div class="btn-group">
            <button id="btn-mode-edit" class="active">Editing Mode</button>
            <button id="btn-mode-preview">Isometric Preview</button>
        </div>

        <div class="btn-group" id="edit-subtools">
            <span style="font-size: 12px; color: #888; margin-right: 4px;">Tool:</span>
            <button id="btn-tool-point" class="active">Point Mode</button>
            <button id="btn-tool-addpoint">Create Point Mode</button>
            <button id="btn-tool-line">Line Mode</button>
        </div>

        <div class="btn-group" id="bg-tools">
            <span style="font-size: 12px; color: #888; margin-right: 4px;">Backgrounds:</span>
            <label class="file-input-label">Top <input type="file" accept="image/*" data-view="top"></label>
            <label class="file-input-label">Left <input type="file" accept="image/*" data-view="left"></label>
            <label class="file-input-label">Front <input type="file" accept="image/*" data-view="front"></label>
            <label class="file-input-label">Rear <input type="file" accept="image/*" data-view="rear"></label>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="workspace">
        
        <!-- 4-View Editor Grid -->
        <div id="editor-grid">
            <!-- Top View (X-Z plane) -->
            <div class="view-panel" id="panel-top">
                <div class="view-title">Top View (X / Z)</div>
                <img class="bg-img" id="bg-top" alt="">
                <svg class="viewport" id="svg-top"></svg>
            </div>

            <!-- Left Side View (Z-Y plane) -->
            <div class="view-panel" id="panel-left">
                <div class="view-title">Left Side View (Z / Y)</div>
                <img class="bg-img" id="bg-left" alt="">
                <svg class="viewport" id="svg-left"></svg>
            </div>

            <!-- Front View (X-Y plane) -->
            <div class="view-panel" id="panel-front">
                <div class="view-title">Front View (X / Y)</div>
                <img class="bg-img" id="bg-front" alt="">
                <svg class="viewport" id="svg-front"></svg>
            </div>

            <!-- Rear View (X-Y plane) -->
            <div class="view-panel" id="panel-rear">
                <div class="view-title">Rear View (X / Y)</div>
                <img class="bg-img" id="bg-rear" alt="">
                <svg class="viewport" id="svg-rear"></svg>
            </div>
        </div>

        <!-- Single Isometric Interactive Preview Panel -->
        <div id="preview-panel">
            <div class="view-title">3D Interactive Preview</div>
            <div class="info-hint">Move mouse horizontally to rotate 360°</div>
            <svg class="viewport" id="svg-iso"></svg>
        </div>

    </div>

    <script>
        // --- INITIAL MODEL STATE ---
        let nextVertexId = 24;
        const vertices = [
            // Base / Bumpers
            { id: 0, x: -33, y: -4, z: 80 },   // FB Top L
            { id: 1, x: 33, y: -4, z: 80 },    // FB Top R
            { id: 2, x: -33, y: 3, z: 80 },    // FB Bot L
            { id: 3, x: 33, y: 3, z: 80 },     // FB Bot R
            { id: 4, x: -35, y: -4, z: -80 },  // RB Top L
            { id: 5, x: 35, y: -4, z: -80 },   // RB Top R
            { id: 6, x: -35, y: 3, z: -80 },   // RB Bot L
            { id: 7, x: 35, y: 3, z: -80 },    // RB Bot R

            // Body Main Frame
            { id: 8, x: -32, y: -20, z: 74 },  // Hood L
            { id: 9, x: 32, y: -20, z: 74 },   // Hood R
            { id: 10, x: -35, y: -20, z: -74 },// Rear Belt L
            { id: 11, x: 35, y: -20, z: -74 }, // Rear Belt R

            // Roof
            { id: 12, x: -28, y: -52, z: 12 },  // Roof Front L
            { id: 13, x: 28, y: -52, z: 12 },   // Roof Front R
            { id: 14, x: -28, y: -52, z: -50 }, // Roof Rear L
            { id: 15, x: 28, y: -52, z: -50 },  // Roof Rear R

            // Windshield / Windows
            { id: 16, x: -32, y: -25, z: 25 },  // Windshield Base L
            { id: 17, x: 32, y: -25, z: 25 },   // Windshield Base R
            { id: 18, x: -28, y: -52, z: -18 }, // B-Pillar Top L
            { id: 19, x: 28, y: -52, z: -18 },  // B-Pillar Top R
            { id: 20, x: -35, y: -20, z: -18 }, // B-Pillar Bot L
            { id: 21, x: 35, y: -20, z: -18 },  // B-Pillar Bot R

            // Grille & Headlight Markers
            { id: 22, x: -20, y: -11, z: 74.5 }, // HL Left Center
            { id: 23, x: 20, y: -11, z: 74.5 },  // HL Right Center
        ];

        const edges = [
            // Front Bumper Frame
            [0, 1], [2, 3], [0, 2], [1, 3],
            // Rear Bumper Frame
            [4, 5], [6, 7], [4, 6], [5, 7],
            // Body Contour & Hood
            [8, 9], [8, 16], [9, 17], [16, 17],
            [8, 0], [9, 1], [10, 4], [11, 5],
            // Windshield & A-Pillars
            [16, 12], [17, 13], [12, 13],
            // Roof & Rear Hatch
            [12, 14], [13, 15], [14, 15],
            [14, 10], [15, 11], [10, 11],
            // B-Pillars & Side Windows
            [18, 19], [18, 20], [19, 21], [12, 18], [13, 19], [14, 18], [15, 19],
            // Headlight Connections
            [0, 22], [1, 23], [8, 22], [9, 23]
        ];

        // System Variables
        let currentMode = 'edit'; // 'edit' or 'preview'
        let currentTool = 'point'; // 'point', 'addpoint', or 'line'
        let selectedPointId = null;
        let hoverPointId = null;
        let selectedEdgeIndex = null;
        let isDragging = false;
        let dragViewType = null;

        // Line Creation Tool Variables
        let lineStartPointId = null;
        let linePreviewMousePos = null; // { x, y } in view plane

        // View Configurations and Axis Mapping
        const views = {
            top:   { svg: document.getElementById('svg-top'),   map: (v) => ({ x: v.x, y: v.z }), unmap: (x, y) => ({ x: x, z: y }) },
            left:  { svg: document.getElementById('svg-left'),  map: (v) => ({ x: -v.z, y: v.y }), unmap: (x, y) => ({ z: -x, y: y }) },
            front: { svg: document.getElementById('svg-front'), map: (v) => ({ x: v.x, y: v.y }), unmap: (x, y) => ({ x: x, y: y }) },
            rear:  { svg: document.getElementById('svg-rear'),  map: (v) => ({ x: -v.x, y: v.y }), unmap: (x, y) => ({ x: -x, y: y }) }
        };

        const isoSvg = document.getElementById('svg-iso');

        // Animation State for 3D Isometric View
        let isoAngleY = 0;
        let isoTargetAngleY = 0;

        // Dynamic Elements Map
        const viewRenderCache = { top: {}, left: {}, front: {}, rear: {}, iso: {} };

        // Helper Projection Functions
        function projectToView(v, viewType, width, height) {
            const scale = 2.2;
            const cx = width / 2;
            const cy = height / 2;
            const projected = views[viewType].map(v);
            return {
                x: cx + projected.x * scale,
                y: cy + projected.y * scale
            };
        }

        function unprojectFromView(screenX, screenY, viewType, width, height) {
            const scale = 2.2;
            const cx = width / 2;
            const cy = height / 2;
            const planeX = (screenX - cx) / scale;
            const planeY = (screenY - cy) / scale;
            return views[viewType].unmap(planeX, planeY);
        }

        function createSvgEl(tag, attrs) {
            const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            for (let k in attrs) el.setAttribute(k, attrs[k]);
            return el;
        }

        // --- RENDER & BUILD EDITING VIEWS ---
        function initViewDOM(viewType) {
            const svg = views[viewType].svg;
            svg.innerHTML = '';

            const lineGroup = createSvgEl('g', { id: `${viewType}-lines` });
            const previewLine = createSvgEl('line', {
                'id': `${viewType}-preview-line`,
                'stroke': '#ffff00',
                'stroke-width': '2',
                'stroke-dasharray': '4 4',
                'display': 'none',
                'pointer-events': 'none'
            });
            const pointGroup = createSvgEl('g', { id: `${viewType}-points` });
            
            svg.appendChild(lineGroup);
            svg.appendChild(previewLine);
            svg.appendChild(pointGroup);

            viewRenderCache[viewType].previewLine = previewLine;

            // Handle Clicks on Empty Canvas for Creation/Deselection
            svg.addEventListener('click', (e) => {
                const rect = svg.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                // 1. Create Point Mode
                if (currentTool === 'addpoint') {
                    const planeCoords = unprojectFromView(mouseX, mouseY, viewType, rect.width, rect.height);
                    const newPoint = { id: nextVertexId++, x: 0, y: 0, z: 0 };
                    Object.assign(newPoint, planeCoords);
                    vertices.push(newPoint);
                    
                    // Auto select the created point
                    selectedPointId = newPoint.id;
                    rebuildDOM();
                    updateAllViews();
                    return;
                }

                // 2. Deselect when clicking empty space
                if (e.target.tagName === 'svg') {
                    if (currentTool === 'line') {
                        lineStartPointId = null;
                        linePreviewMousePos = null;
                    }
                    selectedPointId = null;
                    selectedEdgeIndex = null;
                    updateAllViews();
                }
            });

            // Tracking Mouse Movement for Real-Time Line Creation Preview
            svg.addEventListener('mousemove', (e) => {
                const rect = svg.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                // Handle Point Dragging
                if (isDragging && selectedPointId !== null && dragViewType === viewType) {
                    const updatedPlaneCoords = unprojectFromView(mouseX, mouseY, viewType, rect.width, rect.height);
                    const vertex = vertices.find(v => v.id === selectedPointId);
                    if (vertex) {
                        Object.assign(vertex, updatedPlaneCoords);
                        updateAllViews();
                    }
                }

                // Handle Line Drawing Preview Movement
                if (currentTool === 'line' && lineStartPointId !== null) {
                    linePreviewMousePos = { viewType, x: mouseX, y: mouseY };
                    updateAllViews();
                }
            });

            buildDOMForView(viewType);
        }

        // Build individual dynamic line/point SVG elements
        function buildDOMForView(viewType) {
            const svg = views[viewType].svg;
            const lineGroup = svg.querySelector(`#${viewType}-lines`);
            const pointGroup = svg.querySelector(`#${viewType}-points`);

            lineGroup.innerHTML = '';
            pointGroup.innerHTML = '';

            // Lines
            viewRenderCache[viewType].lines = edges.map((edge, idx) => {
                const line = createSvgEl('line', {
                    'stroke': '#00ffcc',
                    'stroke-width': '2',
                    'data-idx': idx
                });
                line.addEventListener('click', (e) => {
                    if (currentTool === 'line' && lineStartPointId === null) {
                        e.stopPropagation();
                        selectedEdgeIndex = idx;
                        selectedPointId = null;
                        updateAllViews();
                    }
                });
                lineGroup.appendChild(line);
                return line;
            });

            // Points
            viewRenderCache[viewType].points = vertices.map((v) => {
                const handleGroup = createSvgEl('g', { 'data-id': v.id });
                
                const circle = createSvgEl('circle', { 'r': '5', 'fill': '#ff0055', 'cursor': 'pointer' });
                const rect = createSvgEl('rect', {
                    'width': '14', 'height': '14', 'fill': 'none',
                    'stroke': '#ffff00', 'stroke-width': '2',
                    'display': 'none', 'pointer-events': 'none'
                });

                handleGroup.appendChild(circle);
                handleGroup.appendChild(rect);

                handleGroup.addEventListener('mouseenter', () => {
                    if (!isDragging && currentTool !== 'addpoint') {
                        hoverPointId = v.id;
                        updateAllViews();
                    }
                });

                handleGroup.addEventListener('mouseleave', () => {
                    if (!isDragging && hoverPointId === v.id) {
                        hoverPointId = null;
                        updateAllViews();
                    }
                });

                handleGroup.addEventListener('click', (e) => {
                    e.stopPropagation();

                    // LINE EDITING MODE: Two-step click line creation
                    if (currentTool === 'line') {
                        if (lineStartPointId === null) {
                            // First Point Click
                            lineStartPointId = v.id;
                            selectedPointId = v.id;
                            selectedEdgeIndex = null;
                        } else if (lineStartPointId !== v.id) {
                            // Second Point Click -> Add Edge Connection!
                            const edgeExists = edges.some(e => 
                                (e[0] === lineStartPointId && e[1] === v.id) || 
                                (e[0] === v.id && e[1] === lineStartPointId)
                            );
                            if (!edgeExists) {
                                edges.push([lineStartPointId, v.id]);
                            }
                            lineStartPointId = null;
                            linePreviewMousePos = null;
                            selectedPointId = v.id;
                            rebuildDOM();
                        }
                        updateAllViews();
                        return;
                    }

                    // POINT SELECTION MODE
                    if (currentTool === 'point') {
                        selectedPointId = v.id;
                        selectedEdgeIndex = null;
                        updateAllViews();
                    }
                });

                handleGroup.addEventListener('mousedown', (e) => {
                    if (currentTool === 'point') {
                        e.stopPropagation();
                        selectedPointId = v.id;
                        selectedEdgeIndex = null;
                        isDragging = true;
                        dragViewType = viewType;
                        updateAllViews();
                    }
                });

                pointGroup.appendChild(handleGroup);
                return { group: handleGroup, circle: circle, rect: rect };
            });
        }

        function rebuildDOM() {
            ['top', 'left', 'front', 'rear'].forEach(buildDOMForView);
            initIsoDOM();
        }

        window.addEventListener('mouseup', () => {
            isDragging = false;
            dragViewType = null;
        });

        // Update Rendering Across Views
        function updateView(viewType) {
            const svg = views[viewType].svg;
            const rect = svg.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            // 1. Update Existing Edges / Lines
            edges.forEach((edge, idx) => {
                const v1 = vertices.find(v => v.id === edge[0]);
                const v2 = vertices.find(v => v.id === edge[1]);
                if (!v1 || !v2) return;

                const p1 = projectToView(v1, viewType, rect.width, rect.height);
                const p2 = projectToView(v2, viewType, rect.width, rect.height);

                const lineEl = viewRenderCache[viewType].lines[idx];
                if (lineEl) {
                    lineEl.setAttribute('x1', p1.x);
                    lineEl.setAttribute('y1', p1.y);
                    lineEl.setAttribute('x2', p2.x);
                    lineEl.setAttribute('y2', p2.y);

                    if (idx === selectedEdgeIndex) {
                        lineEl.setAttribute('stroke', '#ffff00');
                        lineEl.setAttribute('stroke-width', '3.5');
                    } else {
                        lineEl.setAttribute('stroke', '#00ffcc');
                        lineEl.setAttribute('stroke-width', '2');
                    }
                }
            });

            // 2. Render Interactive Line Creation Preview (Dashed Yellow Line)
            const previewLineEl = viewRenderCache[viewType].previewLine;
            if (currentTool === 'line' && lineStartPointId !== null) {
                const startV = vertices.find(v => v.id === lineStartPointId);
                if (startV) {
                    const pStart = projectToView(startV, viewType, rect.width, rect.height);
                    let targetX = pStart.x;
                    let targetY = pStart.y;

                    if (hoverPointId !== null && hoverPointId !== lineStartPointId) {
                        // Snap to hover target point
                        const hoverV = vertices.find(v => v.id === hoverPointId);
                        const pTarget = projectToView(hoverV, viewType, rect.width, rect.height);
                        targetX = pTarget.x;
                        targetY = pTarget.y;
                    } else if (linePreviewMousePos && linePreviewMousePos.viewType === viewType) {
                        // Follow active mouse pointer
                        targetX = linePreviewMousePos.x;
                        targetY = linePreviewMousePos.y;
                    }

                    previewLineEl.setAttribute('x1', pStart.x);
                    previewLineEl.setAttribute('y1', pStart.y);
                    previewLineEl.setAttribute('x2', targetX);
                    previewLineEl.setAttribute('y2', targetY);
                    previewLineEl.style.display = 'block';
                }
            } else {
                previewLineEl.style.display = 'none';
            }

            // 3. Update Points / Handles
            vertices.forEach((v, idx) => {
                const p = projectToView(v, viewType, rect.width, rect.height);
                const item = viewRenderCache[viewType].points[idx];
                if (!item) return;

                item.circle.setAttribute('cx', p.x);
                item.circle.setAttribute('cy', p.y);
                item.rect.setAttribute('x', p.x - 7);
                item.rect.setAttribute('y', p.y - 7);

                if (v.id === selectedPointId || v.id === lineStartPointId) {
                    item.circle.setAttribute('fill', '#ffff00');
                    item.circle.setAttribute('r', '5');
                    item.rect.style.display = 'block';
                } else if (v.id === hoverPointId) {
                    item.circle.setAttribute('fill', '#00aaff');
                    item.circle.setAttribute('r', '7');
                    item.rect.style.display = 'none';
                } else {
                    item.circle.setAttribute('fill', '#ff0055');
                    item.circle.setAttribute('r', '4');
                    item.rect.style.display = 'none';
                }
            });
        }

        // --- ISOMETRIC PREVIEW ENGINE ---
        function initIsoDOM() {
            isoSvg.innerHTML = '';
            const lineGroup = createSvgEl('g', { id: 'iso-lines' });
            isoSvg.appendChild(lineGroup);

            viewRenderCache.iso.lines = edges.map(() => {
                const line = createSvgEl('line', {
                    'stroke': '#00ffcc',
                    'stroke-width': '2',
                    'stroke-linecap': 'round'
                });
                lineGroup.appendChild(line);
                return line;
            });
        }

        function projectIso(point, angleY, width, height) {
            const isoAngleX = Math.PI / 6;
            const cosY = Math.cos(angleY);
            const sinY = Math.sin(angleY);

            const x1 = point.x * cosY + point.z * sinY;
            const y1 = point.y;
            const z1 = -point.x * sinY + point.z * cosY;

            const cosX = Math.cos(isoAngleX);
            const sinX = Math.sin(isoAngleX);

            const x2 = x1;
            const y2 = y1 * cosX - z1 * sinX;

            const scale = 2.5;
            return {
                x: (width / 2) + x2 * scale,
                y: (height / 2) + y2 * scale
            };
        }

        function updateIsoView() {
            if (currentMode !== 'preview') return;
            const rect = isoSvg.getBoundingClientRect();

            isoAngleY += (isoTargetAngleY - isoAngleY) * 0.08;

            const projectedPoints = vertices.map(v => projectIso(v, isoAngleY, rect.width, rect.height));

            edges.forEach((edge, idx) => {
                const v1Idx = vertices.findIndex(v => v.id === edge[0]);
                const v2Idx = vertices.findIndex(v => v.id === edge[1]);
                if (v1Idx === -1 || v2Idx === -1) return;

                const p1 = projectedPoints[v1Idx];
                const p2 = projectedPoints[v2Idx];
                const line = viewRenderCache.iso.lines[idx];

                if (line) {
                    line.setAttribute('x1', p1.x);
                    line.setAttribute('y1', p1.y);
                    line.setAttribute('x2', p2.x);
                    line.setAttribute('y2', p2.y);

                    if (idx === selectedEdgeIndex) {
                        line.setAttribute('stroke', '#ffff00');
                        line.setAttribute('stroke-width', '3.5');
                    } else {
                        line.setAttribute('stroke', '#00ffcc');
                        line.setAttribute('stroke-width', '2');
                    }
                }
            });

            requestAnimationFrame(updateIsoView);
        }

        window.addEventListener('mousemove', (e) => {
            if (currentMode === 'preview') {
                const mouseX = e.clientX / window.innerWidth;
                isoTargetAngleY = (mouseX - 0.5) * Math.PI * 2;
            }
        });

        // --- GLOBAL REFRESH ---
        function updateAllViews() {
            if (currentMode === 'edit') {
                ['top', 'left', 'front', 'rear'].forEach(updateView);
            }
        }

        // --- UI TOOLBAR NAVIGATION & BUTTONS ---
        const btnEditMode = document.getElementById('btn-mode-edit');
        const btnPreviewMode = document.getElementById('btn-mode-preview');
        const btnToolPoint = document.getElementById('btn-tool-point');
        const btnToolAddPoint = document.getElementById('btn-tool-addpoint');
        const btnToolLine = document.getElementById('btn-tool-line');

        btnEditMode.addEventListener('click', () => {
            currentMode = 'edit';
            document.body.classList.remove('mode-preview');
            btnEditMode.classList.add('active');
            btnPreviewMode.classList.remove('active');
            updateAllViews();
        });

        btnPreviewMode.addEventListener('click', () => {
            currentMode = 'preview';
            document.body.classList.add('mode-preview');
            btnPreviewMode.classList.add('active');
            btnEditMode.classList.remove('active');
            requestAnimationFrame(updateIsoView);
        });

        function setActiveTool(toolName, bodyClass, activeBtn) {
            currentTool = toolName;
            lineStartPointId = null;
            linePreviewMousePos = null;
            document.body.className = document.body.className.replace(/edit-mode-\w+/g, '') + ' ' + bodyClass;
            [btnToolPoint, btnToolAddPoint, btnToolLine].forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
            updateAllViews();
        }

        btnToolPoint.addEventListener('click', () => setActiveTool('point', 'edit-mode-point', btnToolPoint));
        btnToolAddPoint.addEventListener('click', () => setActiveTool('addpoint', 'edit-mode-addpoint', btnToolAddPoint));
        btnToolLine.addEventListener('click', () => setActiveTool('line', 'edit-mode-line', btnToolLine));

        // Background Image Loader Handlers
        document.querySelectorAll('input[type="file"]').forEach(input => {
            input.addEventListener('change', (e) => {
                const viewType = e.target.getAttribute('data-view');
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById(`bg-${viewType}`).src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        window.addEventListener('resize', updateAllViews);

        // INITIALIZE
        ['top', 'left', 'front', 'rear'].forEach(initViewDOM);
        initIsoDOM();
        updateAllViews();
    </script>
</body>
</html>
